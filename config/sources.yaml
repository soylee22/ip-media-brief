# Source registry for the IP & Media Brief.
# Every enabled source returned items on 24 November 2026 from a UK connection.
# GitHub runners use different IP addresses. Run the "Probe sources" workflow
# after setup and disable any source that fails from the runner.
#
# Field reference: schemas/sources.schema.json and SPEC section 7.
# adapter:   rss | gnews | govuk_search | fcl | html_list | embedded_json
# desk:      ip | media
# priority:  1 = core, 2 = standard, 3 = background
# paging:    none | wordpress | blogger | fcl | govuk
# paywalled: true means the article body is behind a paywall. Headline only.
# fetch_article: true allows one GET of the article page to build the AI summary.

defaults:
  enabled: true
  priority: 2
  paging: none
  paywalled: false
  fetch_article: true
  max_new_per_run: 30
  include: []
  exclude: []

