# Location in the repository: .github/workflows/probe.yml
# Tests sources from GitHub's runner without changing any data.
# Run it after setup, and after any change to config/sources.yaml.

name: Probe sources

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated source ids. Leave empty to test every source.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe
        run: python -m brief probe --only "${{ inputs.only }}" --report probe-report.md
      - name: Show the report on the run page
        if: always()
        run: cat probe-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: probe-report
          path: probe-report.md
